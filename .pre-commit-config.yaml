repos:

  # Security, validation checks, and automatic fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Security and validation
      - id: detect-private-key
        name: "[SECURITY] Private key detection"
      - id: check-added-large-files
        name: "[CHECK] Large files detection"
        args: [--maxkb=128]
      - id: check-case-conflict
        name: "[CHECK] Case conflicts"
      - id: check-merge-conflict
        name: "[CHECK] Merge conflicts"
      - id: check-vcs-permalinks
        name: "[CHECK] VCS permalinks"
      - id: check-shebang-scripts-are-executable
        name: "[CHECK] Executable scripts"
      - id: destroyed-symlinks
        name: "[CHECK] Destroyed symlinks"
      - id: check-yaml
        name: "[CHECK] YAML syntax"
      - id: check-toml
        name: "[CHECK] TOML syntax"
      # Automatic fixes
      - id: end-of-file-fixer
        name: "[FIX] End of file"
      - id: fix-byte-order-marker
        name: "[FIX] Byte order marker"
      - id: mixed-line-ending
        name: "[FIX] Line endings"
      - id: trailing-whitespace
        name: "[FIX] Trailing whitespace"
        args: ["--markdown-linebreak-ext=md"]

  # Spell checking
  - repo: https://github.com/crate-ci/typos
    rev: v1.31.2
    hooks:
      - id: typos
        name: "[CHECK] Spelling errors"

  # Code formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.6
    hooks:
      - id: clang-format
        name: "[FORMAT] C/C++ code"
        # We use a custom .clang-format config file
        args: ["-style=file"]
        # Exactly match the style.sh inclusion patterns for file types and directories
        files: '^(src/.*\.(c|cpp|h|cc)|tools/daemon/.*\.(c|cpp|h|cc)|tests/gtest/.*\.(c|cpp|h|cc))$'
        # Exclude the same files as style.sh
        exclude: '^(src/.*config_.*\..*|tests/gtest/googletest/.*|tests/gtest/.*/tap\.h|tests/gtest/.*/gtest\.h|tests/gtest/.*/gtest-all\.cc)$'

  # Documentation formatting
  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: "[FORMAT] Markdown"
        additional_dependencies:
          - mdformat-gfm          # GitHub-Flavored Markdown support
          - mdformat-ruff         # Python code formatting
          - mdformat-frontmatter  # YAML frontmatter support
          - ruff                  # Required for mdformat-ruff
